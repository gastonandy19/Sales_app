<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Sales Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f2f2f2; }
        .summary { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Daily Sales Report</h1>
    <div class="summary">
        <p><strong>Total Sales:</strong> GHS 7.00</p>
        <p><strong>Transactions:</strong> 1</p>
        <p><strong>Total Units Sold:</strong> 2</p>
        <p><strong>Best Selling Item:</strong> Milk</p>
    </div>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Price (GHS)</th>
                <th>Total (GHS)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>Milk</td><td>2</td><td>3.50</td><td>7.00</td></tr>
        </tbody>
    </table>
</body>
</html>
